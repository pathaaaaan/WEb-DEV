<!DOCTYPE html>
<html>
<head>
  <title>Mouse Events</title>
</head>
<body>
  <script>
    const InputDeviceInfo = {
      mouse: { left: false, middle: false, right: false }
    };

    document.addEventListener("mousedown", function (event) {
      if (event.button === 0) InputDeviceInfo.mouse.left = true;
      if (event.button === 1) InputDeviceInfo.mouse.middle = true;
      if (event.button === 2) InputDeviceInfo.mouse.right = true;
      console.log(InputDeviceInfo.mouse);
    });

    document.addEventListener("mouseup", function (event) {
      if (event.button === 0) InputDeviceInfo.mouse.left = false;
      if (event.button === 1) InputDeviceInfo.mouse.middle = false;
      if (event.button === 2) InputDeviceInfo.mouse.right = false;
      console.log(InputDeviceInfo.mouse);
    });
  </script>
</body>
</html>
