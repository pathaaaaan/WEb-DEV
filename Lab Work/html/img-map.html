<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Map</title>
  </head>
  <body>
    <h1>Image Map</h1>
    <img src="shapes.png" usemap="#img" />
    <map name="img">
      <area
        shape="rect"
        coords="112,111,169,148"
        href="https://www.google.com"
        alt="Google"
      />
      <area
        shape="rect"
        coords="34,28,77,71"
        href="https://www.github.com"
        alt="github"
      />
      <area
        alt="wikipedia"
        href="https://wiki.openstreetmap.org/"
        coords="214,108,219,102,226,101,233,102,235,108,237,119,230,128,224,137,217,145,204,136,194,125,188,113,192,104,203,100,209,102"
        shape="poly"
      />
    </map>
    <!-- </map> -->
  </body>
</html>
