<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Navbar</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  /* Header */
  #id {
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #1c5d9d;
    color: white;
    padding: 1rem;
    text-transform: uppercase;
    font-weight: bold;
  }

  header {
    background: #1c5d9d;
    position: sticky;
    top: 0;
    z-index: 1000;
  }

  /* Navbar */
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1200px;
    margin: auto;
    padding: 0 1rem;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .nav-links a, .dropdown button {
    color: white;
    padding: 0.5rem 1rem;
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
    font-weight: bold;
  }

  .nav-links a:hover, .dropdown button:hover {
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
  }

  /* Dropdown */
  .dropdown {
    position: relative;
  }

  .dropdown-content {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: #34495e;
    min-width: 180px;
    border-radius: 4px;
    overflow: hidden;
  }

  .dropdown-content a {
    display: block;
    padding: 0.5rem 1rem;
    color: white;
  }

  .dropdown-content a:hover {
    background: #3b5998;
  }

  .dropdown:hover .dropdown-content {
    display: block;
  }

  /* Hamburger */
  .hamburger {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 5px;
  }

  .hamburger div {
    width: 25px;
    height: 3px;
    background: white;
  }

  /* Responsive */
  @media screen and (max-width: 768px) {
    .nav-links {
      flex-direction: column;
      width: 100%;
      display: none; /* Hidden initially */
    }

    .nav-links.show {
      display: flex;
    }

    .dropdown-content {
      position: relative;
      width: 100%;
    }

    .hamburger {
      display: flex;
    }
  }
</style>
</head>
<body>
<div id="id">THE DERAVIBES</div>
<header>
  <nav>
    <div class="hamburger" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <div class="nav-links" id="navLinks">
      <a href="#">Home</a>
      <div class="dropdown">
        <button>EHS ▼</button>
        <div class="dropdown-content">
          <a href="#">Environment</a>
          <a href="#">Health</a>
          <a href="#">Safety</a>
        </div>
      </div>
      <div class="dropdown">
        <button>Science ▼</button>
        <div class="dropdown-content">
          <a href="#">Physics</a>
          <a href="#">Biology</a>
        </div>
      </div>
      <div class="dropdown">
        <button>Technology & AI ▼</button>
        <div class="dropdown-content">
          <a href="#">AI</a>
          <a href="#">Robotics</a>
        </div>
      </div>
      <div class="dropdown">
        <button>Geopolitics ▼</button>
        <div class="dropdown-content">
          <a href="#">Global Affairs</a>
          <a href="#">Policy</a>
        </div>
      </div>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>
  </nav>
</header>

<script>
  function toggleMenu() {
    const nav = document.getElementById('navLinks');
    nav.classList.toggle('show');
  }
</script>
</body>
</html>
